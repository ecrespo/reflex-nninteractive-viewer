name: Publish

# Release: push a tag vX.Y.Z on a commit of main. The version is taken from the tag.
#   git tag v0.1.0 && git push origin v0.1.0
# Dry run: run this workflow by hand (Actions > Publish > Run workflow) to publish the
# current main to TestPyPI as a development version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"

      - name: The release commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Tests
        run: |
          uv sync --locked
          uv run pytest -m "not browser"

      - name: Build
        run: uv build

      - name: The distributions are complete and render on PyPI
        run: |
          unzip -l dist/*.whl | grep -q 'reflex_nninteractive_viewer/nninteractive_viewer.pyi$'
          unzip -l dist/*.whl | grep -q 'assets/vendor/niivue-0.69.0.esm.js$'
          unzip -l dist/*.whl | grep -q 'assets/nni_viewer.jsx$'
          uvx twine check --strict dist/*

      - id: version
        name: The version matches the tag
        run: |
          version=$(ls dist/*.whl | sed -E 's#dist/reflex_nninteractive_viewer-([^-]+)-.*#\1#')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$version" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::error::built $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/reflex-nninteractive-viewer/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: configure this repository, this workflow and this environment
    # on PyPI once, and no API token is needed.
    environment:
      name: pypi
      url: https://pypi.org/project/reflex-nninteractive-viewer/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: GitHub release with the distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
